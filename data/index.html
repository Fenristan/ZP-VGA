                this._y=y;
            }

                return this._text;

            }

            }

                this._x=x;
            }
            get y() {
                return this._y;
            }
            set y(y) {
                this._y=y;
            }

            }

        function edgeBetweenNodes(nodeA, nodeB, edges)
        {
            //edges = canvasStorages[currentCanvasId].edges
            for(let i = 0; i<edges.length;i++)
            {
                if((edges[i].nodes[0].id==nodeA.id||edges[i].nodes[0].id==nodeB.id)&&(edges[i].nodes[1].id==nodeA.id||edges[i].nodes[1].id==nodeB.id))
                {
                    return true
                }
                else
                {
                    return false
                }
            }
            
        }
        function edgeBetweenNodesBothWays(nodeA, nodeB, edges)
        {
            //edges = canvasStorages[currentCanvasId].edges
            var counter = 0
            for(let i = 0; i<edges.length;i++)
            {
                if((edges[i].nodes[0].id==nodeA.id||edges[i].nodes[0].id==nodeB.id)&&(edges[i].nodes[1].id==nodeA.id||edges[i].nodes[1].id==nodeB.id))
                {
                    counter++;
                }
            }
            if(counter>1)
            {
                return true
            }
            else
            {
                return false
            }
            
        }

        function drawEdges(edges,oldEdges=edges) {
            g = new createjs.Graphics();
            //g.clear();
            context.beginPath();
            console.log("new length: "+edges.length);
            console.log("old length: "+oldEdges.length);
            console.log(oldEdges);

            //canvas = canvases[currentCanvasId];

            for(let i = 0; i<edges.length; i++)
                    {
                            let index = edges[i].id
                            console.log("existing edgeWeight_ is: "+(stage[currentCanvasId].getChildByName("edgeWeight_"+index)));
                    }


                for(let i = 0; i<oldEdges.length;i++)
                {
                    if(stage[currentCanvasId].getChildByName("line_"+oldEdges[i].id)!=null)
                    {
                        console.log("removing: "+(stage[currentCanvasId].getChildByName("line_"+oldEdges[i].id)).name);
                        stage[currentCanvasId].getChildByName("line_"+oldEdges[i].id).graphics.clear();
                        stage[currentCanvasId].removeChild(stage[currentCanvasId].getChildByName("line_"+oldEdges[i].id));
                    }
                }

            for(let i = 0; i<edges.length;i++)
            {
                if(edges[i].nodes.length===2) //if this edge has both nodes, draw
                {
                    var r_start = 24;
                    var r_end = -24;//(edges[i].nodes[1].size/2)*-1

                    var a=edges[i].nodes[1].x-edges[i].nodes[0].x;
                    var b=edges[i].nodes[1].y-edges[i].nodes[0].y;
                    var dist = Math.sqrt(Math.pow(a,2) + Math.pow(b,2));

                    /*var start_x = a/dist;
                    var start_y = b/dist;*/

                    var start_x = edges[i].nodes[0].x + r_start*a/dist;
                    var start_y = edges[i].nodes[0].y + r_start*b/dist;

                    var end_x = edges[i].nodes[1].x + r_end*a/dist;
                    var end_y = edges[i].nodes[1].y + r_end*b/dist;

                    console.log("selectedNodes: ");
                    console.log(canvasStorages[currentCanvasId].selectedNodes);

                    console.log("visitedEdges: ");
                    console.log(canvasStorages[currentCanvasId].visitedEdges);
                    
                    if(canvasStorages[currentCanvasId].visitedEdges.includes(edges[i]))
                    {
                        console.log("yep already there");
                        g.beginStroke("purple");
                    }
                    //if the edge that is about to be draw is the one, that we have just visited, then change color. Check if there are selectedNodes, if so, they will be painted red
                    else if(canvasStorages[currentCanvasId].selectedNodes[0] != null && canvasStorages[currentCanvasId].selectedNodes[1] != null)
                    {
                            if((canvasStorages[currentCanvasId].selectedNodes[0].id == edges[i].nodes[0].id)&&(canvasStorages[currentCanvasId].selectedNodes[1].id == edges[i].nodes[1].id)||(canvasStorages[currentCanvasId].selectedNodes[0].id == edges[i].nodes[1].id)&&(canvasStorages[currentCanvasId].selectedNodes[1].id == edges[i].nodes[0].id))
                            {
                                g.beginStroke("red");
                                if(!(edges[i] in canvasStorages[currentCanvasId].visitedEdges))
                                {
                                    canvasStorages[currentCanvasId].visitedEdges.push(edges[i]);
                                }
                                canvasStorages[currentCanvasId].selectedNodes.shift();
                                canvasStorages[currentCanvasId].selectedNodes.shift();
                            }
                            else 
                            {
                                g.beginStroke("black");
                            }       
                    }
                    else
                    {
                        g.beginStroke("black");
                    }
                    
                    
                    //if multigraph, do bezier
                    if(edgeBetweenNodesBothWays(edges[i].nodes[0],edges[i].nodes[1],edges))
                    {
                        g.setStrokeStyle(3);
                        

                        var start_x = edges[i].nodes[1].x;
                        var start_y = edges[i].nodes[1].y;

                        console.log("there is already an edge between these nodes, doing bezier")
                        g.moveTo(start_x,start_y);

                        /*
                            x1 = mp_x, y1 = mp_y
                            x2 = end_x, y2 = end_y
                            
                        */

                        //calculate vector from node to node
                        //var v = [end_x-start_x,end_y-start_y]
                        //calculate normal 
                        //var dx = end_x - start_x
                        //var dy = end_y - start_y
                        //var n = [-(dy),dx]

                        //calculate middle point between nodes
                        var mp_x = (start_x + end_x)/2
                        var mp_y = (start_y + end_y)/2

                        var end_x = edges[i].nodes[0].x
                        var end_y = edges[i].nodes[0].y

                        var s = 1/Math.sqrt(3)

                        var x3 = mp_x + s*(end_y - mp_y)
                        var y3 = mp_y + s*(mp_x - end_x)

                        //calculate control point
                        var cp_x = x3
                        var cp_y = y3

                        g.bezierCurveTo(cp_x,cp_y,cp_x,cp_y,end_x,end_y)

                        //calculate end points for arrows of bezier
                        var dx = edges[i].nodes[1].x - cp_x;
                        var dy = edges[i].nodes[1].y - cp_y;

                        //change location of edge weight texts
                        console.log("drawing edgeWeight for bezier: "+"edgeWeight_"+edges[i].id);
                        var edgeWeightDom = stage[currentCanvasId].getChildByName("edgeWeight_"+edges[i].id);
                        edgeWeightDom.x = x3;
                        edgeWeightDom.y = y3;
                        stage[currentCanvasId].addChild(edgeWeightDom);

                    }
                    else //draw a regular edge
                    {
                        g.setStrokeStyle(3);
                        
                        /*g.moveTo(edges[i].nodes[0].x,edges[i].nodes[0].y);
                        g.lineTo(edges[i].nodes[1].x,edges[i].nodes[1].y);*/
                        //g.moveTo(edges[i].nodes[0].x,edges[i].nodes[0].y)
                        g.moveTo(start_x,start_y);
                        g.lineTo(end_x,end_y);

                        //calculate end points for arrows of regular edges
                        var dx = edges[i].nodes[0].x - edges[i].nodes[1].x;
                        var dy = edges[i].nodes[0].y - edges[i].nodes[1].y

                        var mp_x = (start_x + end_x)/2
                        var mp_y = (start_y + end_y)/2

                        console.log("moving: "+"edgeWeight_"+edges[i].id)
                        console.log(edgeWeightDom)
                        var edgeWeightDom = stage[currentCanvasId].getChildByName("edgeWeight_"+edges[i].id);
                        //if(edgeWeightDom!=null)
                        //{
                            edgeWeightDom.x = mp_x;
                            edgeWeightDom.y = mp_y;
                            stage[currentCanvasId].addChild(edgeWeightDom);
                        //}
                        
                    }
                    
                    //if directed, draw arrows
                    if(canvas.directed == true)
                    {
                        var length = Math.sqrt(dx * dx + dy * dy);

                        start_x = start_x - Math.round(dx / ((length / (15))));
                        start_y = start_y - Math.round(dy / ((length / (15))));
                        end_x = end_x + Math.round(dx / ((length / (15))));
                        end_y = end_y + Math.round(dy / ((length / (15))));

                        //arrows of bezier point to a different spot
                        if(edgeBetweenNodesBothWays(edges[i].nodes[0],edges[i].nodes[1],edges))
                        {
                            end_x = end_x + Math.round(dx / ((length / (11))));
                            end_y = end_y + Math.round(dy / ((length / (11))));
                        }


                        // calculate the angle of the edge
                        var deg = (Math.atan(dy / dx)) * 180.0 / Math.PI;
                        if (dx < 0) {
                            deg += 180.0;
                        }
                        if (deg < 0) {
                            deg += 360.0;
                        }
                        // calculate the angle for the two triangle points
                        var deg1 = ((deg + 25 + 90) % 360) * Math.PI * 2 / 360.0;
                        var deg2 = ((deg + 335 + 90) % 360) * Math.PI * 2 / 360.0;
                        // calculate the triangle points
                        var arrowx = [];
                        var arrowy = [];
                        arrowx[0] = end_x;
                        arrowy[0] = end_y;
                        arrowx[1] = Math.round(end_x + 12 * Math.sin(deg1));
                        arrowy[1] = Math.round(end_y - 12 * Math.cos(deg1));
                        arrowx[2] = Math.round(end_x + 12 * Math.sin(deg2));
                        arrowy[2] = Math.round(end_y - 12 * Math.cos(deg2));

                        

                        g.beginFill("white");
                        g.moveTo(arrowx[0], arrowy[0]);
                        g.lineTo(arrowx[1], arrowy[1]);
                        g.lineTo(arrowx[2], arrowy[2]);
                        g.lineTo(arrowx[0], arrowy[0]);
                        g.endFill();

                        
                    }
                    var line = new createjs.Shape(g);
                    line.id=edges[i].id;
                    line.name="line_"+edges[i].id;
                    
                    stage[currentCanvasId].addChild(line);
                    stage[currentCanvasId].setChildIndex( line, 0);

                }
            }
        }

        function bindFunctionalityToBitmap(node,bitmap,edges,nodes) {

            bitmap.on("mousedown", function (evt) {
                //this.parent.addChild(this);
                console.log(""+bitmap.id);
                console.log(""+this.name)
                console.log(edges)
                console.log(nodes);
                
                this.offset = {x: this.x - evt.stageX, y: this.y - evt.stageY};
                if(addEdgeFlag==true)
                {
                    if(selectedNodesNumber<1)
                    {
                        selectedNodesNumber++;
                        selectedNodes.push(nodes[bitmap.id]);
                    }
                    else
                    {
                        selectedNodes.push(nodes[bitmap.id]);
                        addEdgeBetweenNodes(selectedNodes,edges);
                        selectedNodesNumber=0;
                        selectedNodes = []
                        addEdgeFlag=false;
                    }
                }
                else if(removeNodeFlag==true)
                {
                    console.log("this je v tomhle pripade:");
                    console.log(this);
                    removeNode(bitmap,nodes,edges);
                }
                else if(removeEdgeFlag==true)
                {
                    if(selectedNodesNumber<1)
                    {
                        selectedNodesNumber++;
                        selectedNodes.push(nodes[bitmap.id]);
                    }
                    else
                    {
                        selectedNodes.push(nodes[bitmap.id]);
                        removeEdgeBetweenNodes(selectedNodes,edges);
                        selectedNodesNumber=0;
                        selectedNodes = []
                        removeEdgeFlag=false;
                    }
                }
                update=true;
                removeNodeFlag=false;
            });

            // the pressmove event is dispatched when the mouse moves after a mousedown on the target until the mouse is released.
            bitmap.on("pressmove", function (evt) {

                node.x=evt.stageX + this.offset.x;
                node.y=evt.stageY + this.offset.y;
                this.x = node.x
                this.y = node.y

                for(var i = 0; i < edges.length; i++)
                {
                    if(node.id===edges[i].nodes[0].id)
                    {
                        g.clear();
                        edges[i].nodes[0]=node
                        drawEdges(edges);
                    }
                    else if(node.id===edges[i].nodes[1].id)
                    {
                        g.clear();
                        edges[i].nodes[1]=node
                        drawEdges(edges);
                    }
                }
                var node_text = this.parent.getChildByName("text_"+this.id);
                node_text.x=node.x-textoffset;//textoffset;
                node_text.y=node.y-textoffset-3;//textoffset;

                this.parent.addChild(node_text);
                // indicate that the stage should be updated on the next tick:
                update = true;
            });

            bitmap.on("rollover", function (evt) {
                //this.scale = this.originalScale * 1.2;
                update = true;
            });

            bitmap.on("rollout", function (evt) {
                //this.scale = this.originalScale;
                update = true;
            });

            bitmap.parent.getChildByName("text_"+bitmap.id).on("dblclick", function (evt)
            {
                let node_text = this;
                node_text.text = "";
            });
            bitmap.on("dblclick", function (evt) {
                
                for(var i = 0; i<canvasStorages[currentCanvasId].nodes.length; i++)
                {
                    containers[currentCanvasId].getChildByName("bmp_"+i).image=nodeImage;
                }
                this.image = selectedNodeImage;
                canvasStorages[currentCanvasId].startingNode=node;
                update = true;
            });
        }

            for(let i = 0; i < stage.length; i++)

            var text;
            

            for(let i = 0; i < stage.length; i++)

                stage[i].addChild(containers[i]);

            //const nodes = [];

            for(var i = 0; i < 5; i++)
            {
                canvasStorages[currentCanvasId].nodes.push(new Node(i,i,(canvas.width * Math.random() | 0),(canvas.height * Math.random() | 0)));
            }

            //canvasStorages[currentCanvasId].edges.push(new Edge(0,[canvasStorages[currentCanvasId].nodes[0],canvasStorages[currentCanvasId].nodes[1]],1));
            //canvasStorages[currentCanvasId].edges.push(new Edge(1,[canvasStorages[currentCanvasId].nodes[1],canvasStorages[currentCanvasId].nodes[2]],1));

            canvasStorages[currentCanvasId].edges = [];

            addEdgeBetweenNodes([canvasStorages[currentCanvasId].nodes[0],canvasStorages[currentCanvasId].nodes[1]],canvasStorages[currentCanvasId].edges);
            addEdgeBetweenNodes([canvasStorages[currentCanvasId].nodes[1],canvasStorages[currentCanvasId].nodes[2]],canvasStorages[currentCanvasId].edges);

            // create and populate the screen with random daisies:
            for (var i = 0; i < canvasStorages[currentCanvasId].nodes.length; i++) {

                bitmap = new createjs.Bitmap(node_image);
                addNodeToBitmap(canvasStorages[currentCanvasId].nodes[i],containers[currentCanvasId],bitmap);

                // using "on" binds the listener to the scope of the currentTarget by default
                // in this case that means it executes in the scope of the button.
                bindFunctionalityToBitmap(canvasStorages[currentCanvasId].nodes[i],bitmap,canvasStorages[currentCanvasId].edges, canvasStorages[currentCanvasId].nodes);
            }
            for(let i = 0; i < stage.length; i++)
            {
                stage[i].on("stagemousedown", function(evt) {
                    if(addNodeFlag==true)
                    {
                        var newNode = new Node(canvasStorages[currentCanvasId].nodes.length,canvasStorages[currentCanvasId].nodes.length,(evt.stageX),(evt.stageY))
                        canvasStorages[currentCanvasId].nodes.push(newNode);

                        bindFunctionalityToBitmap(newNode,bitmap,canvasStorages[currentCanvasId].edges,canvasStorages[currentCanvasId].nodes);
                        addNodeFlag=false;
                        update = true;
                    }
                    /*else if(addEdge==true)
                    {
                        selectedNodesNumber++;
                        selectedNodes.push()

                        var newEdge = new Edge(edges.length,)
                    }*/
                    stage[currentCanvasId].update(event)
                    /*for(let i =0; i<edges.length;i++)
                    {
                        console.log(""+stage.getChildByName("line_"+edges[i].id));
                    }*/
                    console.log("clicked in canvas "+currentCanvasId);
                    //drawEdges(edges);

                });
            }


            drawEdges(canvasStorages[currentCanvasId].edges);

            examples.hideDistractor();
            createjs.Ticker.addEventListener("tick", tick);
        }

        function tick(event) {
            // this set makes it so the stage only re-renders when an event handler indicates a change has happened.
            if (update) {
                update = false; // only update once
                stage[currentCanvasId].update(event);
            }
        }
