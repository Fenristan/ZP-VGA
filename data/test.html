<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title></title>

    <link href="./assets/css/shared.css" rel="stylesheet" type="text/css"/>
    <link href="./assets/css/examples.css" rel="stylesheet" type="text/css"/>
    <script src="./assets/js/examples.js"></script>

    <script src="./lib/easeljs-NEXT.js"></script>

    <script id="editable">
        class Node {
            constructor(id, text, x, y) {
                this._id = id;
                this._text=text;
                this._x=x;
                this._y=y;
            }
            get text() {
                return this._text;
            }
            get id() {
                return this._id;
            }
            get x() {
                return this._x;
            }
            set x(x) {
                this._x=x;
            }
            get y() {
                return this._y;
            }
            set y(y) {
                this._y=y;
            }
            get size()
            {
                return this._size;
            }
            set size(size)
            {
                this._size=size;
            }

        }

        class Edge{
            constructor(id, nodes) {
                this._id = id;
                this._nodes=nodes;
            }
            get id() {
                return this._id;
            }
            get nodes() {
                return this._nodes;
            }

            set nodes(value) {
                this._nodes = value;
            }
        }

        var canvas, stage;
        var g;

        var mouseTarget;	// the display object currently under the mouse, or being dragged
        var dragStarted;	// indicates whether we are currently in a drag operation
        var offset;
        var update = true;

        function init() {
            examples.showDistractor();
            // create stage and point it to the canvas:
            canvas = document.getElementById("testCanvas");
            stage = new createjs.Stage(canvas);
            g = new createjs.Graphics();
            // enable touch interactions if supported on the current device:
            createjs.Touch.enable(stage);

            // enabled mouse over / out events
            stage.enableMouseOver(10);
            stage.mouseMoveOutside = true; // keep tracking the mouse even when it leaves the canvas

            // load the source image:
            var image = new Image();
            image.src = "./assets/images/node.png";
            image.onload = handleImageLoad;
        }

        function stop() {
            createjs.Ticker.removeEventListener("tick", tick);
        }

        function drawEdges(edges) {
            for(var i = 0; i<edges.length;i++)
            {
                if(edges[i].nodes.length===2)
                {
                    var r_start = 24;
                    var r_end = -24;//(edges[i].nodes[1].size/2)*-1

                    var a=edges[i].nodes[1].x-edges[i].nodes[0].x;
                    var b=edges[i].nodes[1].y-edges[i].nodes[0].y;
                    var dist = Math.sqrt(Math.pow(a,2) + Math.pow(b,2));

                    /*var start_x = a/dist;
                    var start_y = b/dist;*/

                    var start_x = edges[i].nodes[0].x + r_start*a/dist;
                    var start_y = edges[i].nodes[0].y + r_start*b/dist;

                    var end_x = edges[i].nodes[1].x + r_end*a/dist;
                    var end_y = edges[i].nodes[1].y + r_end*b/dist;

                    g.setStrokeStyle(3);
                    g.beginStroke("red");
                    /*g.moveTo(edges[i].nodes[0].x,edges[i].nodes[0].y);
                    g.lineTo(edges[i].nodes[1].x,edges[i].nodes[1].y);*/
                    //g.moveTo(edges[i].nodes[0].x,edges[i].nodes[0].y)
                    g.moveTo(start_x,start_y)
                    g.lineTo(end_x,end_y);
                    g.endStroke();
                    var line = new createjs.Shape(g);
                    stage.addChild(line);
                }
            }
        }

        function handleImageLoad(event) {
            var image = event.target;
            var bitmap;
            var container = new createjs.Container();
            var text;
            var textoffset = 3;
            stage.addChild(container);

            const nodes = [];
            const edges = [];

            for(var i = 0; i < 5; i++)
            {
                nodes.push(new Node(i,i,(canvas.width * Math.random() | 0),(canvas.height * Math.random() | 0)));
            }

            edges.push(new Edge(0,[nodes[0],nodes[1]]));
            edges.push(new Edge(0,[nodes[1],nodes[2]]));

            // create and populate the screen with random daisies:
            for (var i = 0; i < nodes.length; i++) {
                bitmap = new createjs.Bitmap(image);
                text  = new createjs.Text(nodes[i].id);
                container.addChild(bitmap,text);
                bitmap.x = nodes[i].x;
                bitmap.y = nodes[i].y;
                //bitmap.rotation = 360 * Math.random() | 0;
                bitmap.regX = bitmap.image.width / 2 | 0;
                bitmap.regY = bitmap.image.height / 2 | 0;
                //bitmap.scale = bitmap.originalScale = Math.random() * 0.4 + 0.6;
                bitmap.scale = 0.7;
                bitmap.name = "bmp_" + i;
                bitmap.id = (nodes[i].id);
                bitmap.cursor = "pointer";
                nodes[i].size=(bitmap.getBounds().width);

                text.x = nodes[i].x-textoffset;
                text.y = nodes[i].y-textoffset;
                //text.text(nodes[i].text);
                /*text.regX = bitmap.image.width / 2 | 0;
                text.regY = bitmap.image.height / 2 | 0;*/
                text.name = "text_" + i;
                text.id = (nodes[i].id);
                text.cursor = "pointer";
                text.scale = 1.5;
                //text.color = "red";

                // using "on" binds the listener to the scope of the currentTarget by default
                // in this case that means it executes in the scope of the button.
                bitmap.on("mousedown", function (evt) {
                    this.parent.addChild(this);
                    this.offset = {x: this.x - evt.stageX, y: this.y - evt.stageY};
                });

                // the pressmove event is dispatched when the mouse moves after a mousedown on the target until the mouse is released.
                bitmap.on("pressmove", function (evt) {
                    nodes[this.id].x=evt.stageX + this.offset.x;
                    nodes[this.id].y=evt.stageY + this.offset.y;
                    this.x = nodes[this.id].x
                    this.y = nodes[this.id].y

                    for(var i = 0; i < edges.length; i++)
                    {
                        if(nodes[this.id].id===edges[i].nodes[0].id)
                        {
                            g.clear();
                            edges[i].nodes[0]=nodes[this.id]
                            drawEdges(edges);
                        }
                        else if(nodes[this.id].id===edges[i].nodes[1].id)
                        {
                            g.clear();
                            edges[i].nodes[1]=nodes[this.id]
                            drawEdges(edges);
                        }
                    }
                    var node_text = this.parent.getChildByName("text_"+this.id);
                    node_text.x=nodes[this.id].x-textoffset;
                    node_text.y=nodes[this.id].y-textoffset;

                    this.parent.addChild(node_text);
                    // indicate that the stage should be updated on the next tick:
                    update = true;
                });

                bitmap.on("rollover", function (evt) {
                    //this.scale = this.originalScale * 1.2;
                    update = true;
                });

                bitmap.on("rollout", function (evt) {
                    //this.scale = this.originalScale;
                    update = true;
                });


            }
                drawEdges(edges);

            examples.hideDistractor();
            createjs.Ticker.addEventListener("tick", tick);
        }

        function tick(event) {
            // this set makes it so the stage only re-renders when an event handler indicates a change has happened.
            if (update) {
                update = false; // only update once
                stage.update(event);
            }
        }
    </script>

</head>

<body onload="init();">
<header>
    <h1>Proof of concept aplikace</h1>
</header>

<div>
    <canvas id="testCanvas" width="960" height="400"></canvas>
</div>
</body>
</html>
