        class Node {
            constructor(id, text, x, y) {

            get y() {

            }

        function drawEdges(edges,oldEdges=edges) {
            g = new createjs.Graphics();
            //g.clear();
            context.beginPath();
            console.log("new length: "+edges.length);
            console.log("old length: "+oldEdges.length);
            console.log(oldEdges);

                for(let i = 0; i<oldEdges.length;i++)
                {
                    if(stage[currentCanvasId].getChildByName("line_"+oldEdges[i].id)!=null)
                    {
                        console.log("removing: "+stage[currentCanvasId].getChildByName("line_"+oldEdges[i].id));
                        stage[currentCanvasId].getChildByName("line_"+oldEdges[i].id).graphics.clear();
                        stage[currentCanvasId].removeChild(stage[currentCanvasId].getChildByName("line_"+oldEdges[i].id));
                    }
                }

            for(let i = 0; i<edges.length;i++)
            {
                if(edges[i].nodes.length===2)
                {
                    var r_start = 24;
                    var r_end = -24;//(edges[i].nodes[1].size/2)*-1

                    var a=edges[i].nodes[1].x-edges[i].nodes[0].x;
                    var b=edges[i].nodes[1].y-edges[i].nodes[0].y;
                    var dist = Math.sqrt(Math.pow(a,2) + Math.pow(b,2));

                    /*var start_x = a/dist;
                    var start_y = b/dist;*/

                    var start_x = edges[i].nodes[0].x + r_start*a/dist;
                    var start_y = edges[i].nodes[0].y + r_start*b/dist;

                    var end_x = edges[i].nodes[1].x + r_end*a/dist;
                    var end_y = edges[i].nodes[1].y + r_end*b/dist;

                    g.setStrokeStyle(3);
                    g.beginStroke("red");
                    /*g.moveTo(edges[i].nodes[0].x,edges[i].nodes[0].y);
                    g.lineTo(edges[i].nodes[1].x,edges[i].nodes[1].y);*/
                    //g.moveTo(edges[i].nodes[0].x,edges[i].nodes[0].y)
                    g.moveTo(start_x,start_y);
                    g.lineTo(end_x,end_y);
                    g.endStroke();

                    var dx = edges[i].nodes[0].x - edges[i].nodes[1].x;
                    var dy = edges[i].nodes[0].y - edges[i].nodes[1].y
                    var length = Math.sqrt(dx * dx + dy * dy);

                    start_x = start_x - Math.round(dx / ((length / (15))));
                    start_y = start_y - Math.round(dy / ((length / (15))));
                    end_x = end_x + Math.round(dx / ((length / (15))));
                    end_y = end_y + Math.round(dy / ((length / (15))));

                    // calculate the angle of the edge
                    var deg = (Math.atan(dy / dx)) * 180.0 / Math.PI;
                    if (dx < 0) {
                        deg += 180.0;
                    }
                    if (deg < 0) {
                        deg += 360.0;
                    }
                    // calculate the angle for the two triangle points
                    var deg1 = ((deg + 25 + 90) % 360) * Math.PI * 2 / 360.0;
                    var deg2 = ((deg + 335 + 90) % 360) * Math.PI * 2 / 360.0;
                    // calculate the triangle points
                    var arrowx = [];
                    var arrowy = [];
                    arrowx[0] = end_x;
                    arrowy[0] = end_y;
                    arrowx[1] = Math.round(end_x + 12 * Math.sin(deg1));
                    arrowy[1] = Math.round(end_y - 12 * Math.cos(deg1));
                    arrowx[2] = Math.round(end_x + 12 * Math.sin(deg2));
                    arrowy[2] = Math.round(end_y - 12 * Math.cos(deg2));

                    g.beginFill("red");
                    g.moveTo(arrowx[0], arrowy[0]);
                    g.lineTo(arrowx[1], arrowy[1]);
                    g.lineTo(arrowx[2], arrowy[2]);
                    g.lineTo(arrowx[0], arrowy[0]);
                    g.endFill();

                    var line = new createjs.Shape(g);
                    line.id=edges[i].id;
                    line.name="line_"+edges[i].id;
                    stage[currentCanvasId].addChild(line);


                }
            }
        }

        function addEdgeBetweenNodes(nodes,edges)
        {
            var edge = new Edge(edges.length,nodes);
            edges.push(edge);
            drawEdges(edges);
        }
        function removeEdgeBetweenNodes(nodes,edges)
        {
            let oldEdges = edges.slice(0);
            //var edge = new Edge(edges.length,nodes);
            for(let i = 0; i<edges.length; i++)
            {
                if((edges[i].nodes[0]==nodes[0]||edges[i].nodes[0]==nodes[1])&&(edges[i].nodes[1]==nodes[0]||edges[i].nodes[1]==nodes[1]))
                {
                    for(let j = edges[i].id; j < edges.length-1; j++)
                    {
                        edges[j]=edges[j+1];
                        edges[j].id=(edges[j].id)-1;
                        /*let selectedLine = this.parent.getChildByName("line_"+(i+1));
                        selectedLine.id=selectedLine.id-1;
                        selectedLine.name="bmp_"+i;
                        this.parent.addChild(selectedLine);*/
                    }
                    edges.pop();
                    console.log(edges);
                    //this.parent.removeChild(this.parent.getChildByName("line_"+edges[i].id));
                }
            }
            drawEdges(edges,oldEdges);
        }
        function removeAllEdgesFromNode(node,nodes,edges)
        {
            //var edge = new Edge(edges.length,nodes);
            let oldEdges = edges.slice(0);
            for(let i = 0; i<edges.length; i++)
            {
                console.log("id ndoe predaneho"+node.id);

                //if((edges[i].nodes[0].id==node.id||edges[i].nodes[1].id==node.id))
                if((edges[i].nodes[0]==node||edges[i].nodes[1]==node))

                    //stage.removeChild(stage.getChildByName("line_"+edges[i].id));
                    edges.pop();
                    //console.log(edges);

                }

            }

            drawEdges(edges,oldEdges);
        }

        function bindFunctionalityToBitmap(node,bitmap,edges,nodes) {

            bitmap.on("mousedown", function (evt) {
                //this.parent.addChild(this);
                console.log(""+bitmap.id);
                console.log(""+this.name)
                console.log(edges)
                console.log(nodes);
                this.offset = {x: this.x - evt.stageX, y: this.y - evt.stageY};
                if(addEdgeFlag==true)
                {
                    if(selectedNodesNumber<1)
                    {
                        selectedNodesNumber++;
                        selectedNodes.push(nodes[bitmap.id]);
                    }
                    else
                    {
                        selectedNodes.push(nodes[bitmap.id]);
                        addEdgeBetweenNodes(selectedNodes,edges);
                        selectedNodesNumber=0;
                        selectedNodes = []
                        addEdgeFlag=false;
                    }
                }
                else if(removeNodeFlag==true)
                {
                    let oldEdges = edges.slice(0);
                    console.log(nodes)
                    removeAllEdgesFromNode(nodes[bitmap.id],nodes,edges);
                    //drawEdges(edges);
                    for(let i = bitmap.id; i < nodes.length-1; i++)
                    {
                        console.log("stalo se");
                        nodes[i]=nodes[i+1];
                        nodes[i].id=(nodes[i].id)-1;
                        let selectedBitmap = this.parent.getChildByName("bmp_"+(i+1));
                        selectedBitmap.id=selectedBitmap.id-1;
                        selectedBitmap.name="bmp_"+i;
                        this.parent.addChild(selectedBitmap);

                        let node_text = this.parent.getChildByName("text_"+selectedBitmap.id);
                        node_text.x=selectedBitmap.x-textoffset;
                        node_text.y=selectedBitmap.y-textoffset-3;
                        this.parent.addChild(node_text);
                    }
                    nodes.pop();

                    //cleanupnu smycku vytvorenou mezi smazanym edgem
                    for(let i = 0; i<edges.length; i++)
                    {
                        if((edges[i].nodes[0].id===edges[i].nodes[1].id))
                        {
                            console.log("HALO HALO");
                            for(let j = edges[i].id; j < edges.length-1; j++)
                            {
                                edges[j]=edges[j+1];
                                edges[j].id=(edges[j].id)-1;
                            }
                            edges.pop();
                        }
                    }

                    drawEdges(edges,oldEdges);

                    this.parent.removeChild(this.parent.getChildByName("text_"+nodes.length));
                    let text = document.getElementById("test_"+currentCanvasId+"_"+nodes.length);
                    text.parentNode.removeChild(text);
                    this.parent.removeChild(this);
                }
                else if(removeEdgeFlag==true)
                {
                    if(selectedNodesNumber<1)
                    {
                        selectedNodesNumber++;
                        selectedNodes.push(nodes[bitmap.id]);
                    }
                    else
                    {
                        selectedNodes.push(nodes[bitmap.id]);
                        removeEdgeBetweenNodes(selectedNodes,edges);
                        selectedNodesNumber=0;
                        selectedNodes = []
                        removeEdgeFlag=false;
                    }
                }
                update=true;
                removeNodeFlag=false;
            });

            // the pressmove event is dispatched when the mouse moves after a mousedown on the target until the mouse is released.
            bitmap.on("pressmove", function (evt) {

                node.x=evt.stageX + this.offset.x;
                node.y=evt.stageY + this.offset.y;
                this.x = node.x
                this.y = node.y

                for(var i = 0; i < edges.length; i++)
                {
                    if(node.id===edges[i].nodes[0].id)
                    {
                        g.clear();
                        edges[i].nodes[0]=node
                        drawEdges(edges);
                    }
                    else if(node.id===edges[i].nodes[1].id)
                    {
                        g.clear();
                        edges[i].nodes[1]=node
                        drawEdges(edges);
                    }
                }
                var node_text = this.parent.getChildByName("text_"+this.id);
                node_text.x=node.x-textoffset;//textoffset;
                node_text.y=node.y-textoffset-3;//textoffset;

                this.parent.addChild(node_text);
                // indicate that the stage should be updated on the next tick:
                update = true;
            });

            bitmap.on("rollover", function (evt) {
                //this.scale = this.originalScale * 1.2;
                update = true;
            });

            bitmap.on("rollout", function (evt) {
                //this.scale = this.originalScale;
                update = true;
            });

            bitmap.parent.getChildByName("text_"+bitmap.id).on("dblclick", function (evt)
            {
                let node_text = this;
                node_text.text = "";
            });
        }

        function handleImageLoad(event) {
            var textoffset = 3;
            var bitmap;
            var containers = [];
            for(let i = 0; i < stage.length; i++)
            {
                containers[i] = new createjs.Container();
            }
            var text;
            var node_image = "./assets/images/node.png";
            var add_edge_image = "./assets/images/addedge.png";

            for(let i = 0; i < stage.length; i++)
            {
                stage[i].addChild(containers[i]);
            }


            //const nodes = [];
            //const edges = [];

            for(var i = 0; i < 5; i++)
            {
                canvasStorages[currentCanvasId].nodes.push(new Node(i,i,(canvas.width * Math.random() | 0),(canvas.height * Math.random() | 0)));
            }

            canvasStorages[currentCanvasId].edges.push(new Edge(0,[canvasStorages[currentCanvasId].nodes[0],canvasStorages[currentCanvasId].nodes[1]]));
            canvasStorages[currentCanvasId].edges.push(new Edge(1,[canvasStorages[currentCanvasId].nodes[1],canvasStorages[currentCanvasId].nodes[2]]));

            // create and populate the screen with random daisies:
            for (var i = 0; i < canvasStorages[currentCanvasId].nodes.length; i++) {

                bitmap = new createjs.Bitmap(node_image);
                addNodeToBitmap(canvasStorages[currentCanvasId].nodes[i],containers[currentCanvasId],bitmap);

                // using "on" binds the listener to the scope of the currentTarget by default
                // in this case that means it executes in the scope of the button.
                bindFunctionalityToBitmap(canvasStorages[currentCanvasId].nodes[i],bitmap,canvasStorages[currentCanvasId].edges, canvasStorages[currentCanvasId].nodes);
            }
            for(let i = 0; i < stage.length; i++)
            {
                stage[i].on("stagemousedown", function(evt) {
                    if(addNodeFlag==true)
                    {
                        var newNode = new Node(canvasStorages[currentCanvasId].nodes.length,canvasStorages[currentCanvasId].nodes.length,(evt.stageX),(evt.stageY))
                        canvasStorages[currentCanvasId].nodes.push(newNode);
                        console.log(newNode);
                        console.log(canvasStorages[currentCanvasId].nodes);
                        var bitmap = new createjs.Bitmap(node_image);
                        addNodeToBitmap(newNode,containers[currentCanvasId],bitmap);
                        bindFunctionalityToBitmap(newNode,bitmap,canvasStorages[currentCanvasId].edges,canvasStorages[currentCanvasId].nodes);
                        addNodeFlag=false;
                        update = true;
                    }
                    /*else if(addEdge==true)

                        selectedNodes.push()

                        var newEdge = new Edge(edges.length,)
                    }*/
                    stage[currentCanvasId].update(event)
                    /*for(let i =0; i<edges.length;i++)
                    {
                        console.log(""+stage.getChildByName("line_"+edges[i].id));
                    }*/
                    console.log("clicked in canvas "+currentCanvasId);
                    //drawEdges(edges);

                });
            }


            drawEdges(canvasStorages[currentCanvasId].edges);

            examples.hideDistractor();
            createjs.Ticker.addEventListener("tick", tick);
        }

        function tick(event) {
            // this set makes it so the stage only re-renders when an event handler indicates a change has happened.
            if (update) {
                update = false; // only update once
                stage[currentCanvasId].update(event);
            }
        }
