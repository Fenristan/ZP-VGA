<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title></title>

    <link href="./assets/css/shared.css" rel="stylesheet" type="text/css"/>
    <link href="./assets/css/examples.css" rel="stylesheet" type="text/css"/>
    <script src="./assets/js/examples.js"></script>

    <script id="editable">
        class Node {
            constructor(id, text, x, y) {
                this._id = id;
                this._text=text;
                this._x=x;
                this._y=y;
            }
            get text() {
                return this._text;
            }
            get id() {
                return this._id;
            }
            get x() {
                return this._x;
            }
            set x(x) {
                this._x=x;
            }
            get y() {
                return this._y;
            }
            set y(y) {
                this._y=y;
            }
            get size()
            {
                return this._size;
            }
            set size(size)
            {
                this._size=size;
            }
            set id(id)
            {
                this._id=id;
            }

        }

        class Edge{
            constructor(id, nodes) {
                this._id = id;
                this._nodes=nodes;
            }
            get id() {
                return this._id;
            }
            get nodes() {
                return this._nodes;
            }

            set nodes(value) {
                this._nodes = value;
            }

            set id(id)
            {
                this._id=id;
            }
        }

        var canvas, stage;
        var g;

        var mouseTarget;	// the display object currently under the mouse, or being dragged
        var dragStarted;	// indicates whether we are currently in a drag operation
        var offset;
        var update = true;
        var addNodeFlag = false;
        var addEdgeFlag = false;
        var removeNodeFlag = false;
        var removeEdgeFlag = false;
        var selectedNodesNumber = 0;
        var selectedNodes = [];
        var textoffset = 3;

        function init() {
            examples.showDistractor();
            // create stage and point it to the canvas:
            canvas = document.getElementById("testCanvas");
            stage = new createjs.Stage(canvas);
            g = new createjs.Graphics();
            // enable touch interactions if supported on the current device:
            createjs.Touch.enable(stage);

            // enabled mouse over / out events
            stage.enableMouseOver(10);
            stage.mouseMoveOutside = true; // keep tracking the mouse even when it leaves the canvas

            // load the source image:
            var image = new Image();
            image.src = "./assets/images/node.png";
            image.onload = handleImageLoad;
        }

        function stop() {
            createjs.Ticker.removeEventListener("tick", tick);
        }

        function drawEdges(edges) {
            g.clear();
            for(let i = 0; i<edges.length;i++)
            {
                if(edges[i].nodes.length===2)
                {
                    var r_start = 24;
                    var r_end = -24;//(edges[i].nodes[1].size/2)*-1

                    var a=edges[i].nodes[1].x-edges[i].nodes[0].x;
                    var b=edges[i].nodes[1].y-edges[i].nodes[0].y;
                    var dist = Math.sqrt(Math.pow(a,2) + Math.pow(b,2));

                    /*var start_x = a/dist;
                    var start_y = b/dist;*/

                    var start_x = edges[i].nodes[0].x + r_start*a/dist;
                    var start_y = edges[i].nodes[0].y + r_start*b/dist;

                    var end_x = edges[i].nodes[1].x + r_end*a/dist;
                    var end_y = edges[i].nodes[1].y + r_end*b/dist;

                    g.setStrokeStyle(3);
                    g.beginStroke("red");
                    /*g.moveTo(edges[i].nodes[0].x,edges[i].nodes[0].y);
                    g.lineTo(edges[i].nodes[1].x,edges[i].nodes[1].y);*/
                    //g.moveTo(edges[i].nodes[0].x,edges[i].nodes[0].y)
                    g.moveTo(start_x,start_y)
                    g.lineTo(end_x,end_y);
                    g.endStroke();
                    var line = new createjs.Shape(g);
                    line.id=edges[i].id;
                    line.name="line_"+edges[i].id;
                    stage.addChild(line);
                }
            }
        }

        function addNodeToBitmap(node,container,bitmap) {
            var text  = new createjs.Text(node.id);

            bitmap.x = node.x;
            bitmap.y = node.y;
            //bitmap.rotation = 360 * Math.random() | 0;
            bitmap.regX = bitmap.image.width / 2 | 0;
            bitmap.regY = bitmap.image.height / 2 | 0;
            //bitmap.scale = bitmap.originalScale = Math.random() * 0.4 + 0.6;
            bitmap.scale = 0.7;
            bitmap.name = "bmp_" + node.id;
            bitmap.id = (node.id);
            bitmap.cursor = "pointer";
            node.size=(bitmap.getBounds().width);

            /*text.x = node.x-textoffset;
            text.y = node.y-textoffset;
            text.name = "text_" + node.id;
            text.id = (node.id);
            text.cursor = "pointer";
            text.scale = 1.5;*/

            var html = document.createElement("div");
            html.innerHTML = ""+node.text;
            html.id = "test_"+node.id;
            html.style.contenteditable="true";
            //html.id="text_"+node.id;
            //html.id="text_"+node.id;
            //html.style.height = '50px';
            //html.style.width = '100px';
            //html.style.backgroundColor = '#000000';
            /*html.style.position = "absolute";
            html.style.top = (0).toString();
            html.style.left = (0).toString();*/
            //html.style.bottom = node.y;

            //var content = document.createTextNode(""+node.id);
            //html.appendChild(content);*/
            document.getElementById("test").appendChild(html).contentEditable = "true";

            var text1 = new createjs.DOMElement(html);
            text1.id = node.id;
            text1.name = "text_" + node.id;
            text1.cursor = "pointer";
            text1.x = node.x-textoffset;
            text1.y = node.y-textoffset-3;

            container.addChild(bitmap,text1);
        }

        function addEdgeBetweenNodes(nodes,edges)
        {
            var edge = new Edge(edges.length,nodes);
            edges.push(edge);
            drawEdges(edges);
        }
        function removeEdgeBetweenNodes(nodes,edges)
        {
            //var edge = new Edge(edges.length,nodes);
            for(let i = 0; i<edges.length; i++)
            {
                if((edges[i].nodes[0]==nodes[0]||edges[i].nodes[0]==nodes[1])&&(edges[i].nodes[1]==nodes[0]||edges[i].nodes[1]==nodes[1]))
                {
                    for(let j = edges[i].id; j < edges.length-1; j++)
                    {
                        edges[j]=edges[j+1];
                        edges[j].id=(edges[j].id)-1;
                        /*let selectedLine = this.parent.getChildByName("line_"+(i+1));
                        selectedLine.id=selectedLine.id-1;
                        selectedLine.name="bmp_"+i;
                        this.parent.addChild(selectedLine);*/
                    }
                    edges.pop();
                    console.log(edges);
                    //this.parent.removeChild(this.parent.getChildByName("line_"+edges[i].id));
                }
            }
            drawEdges(edges);
        }
        function removeAllEdgesFromNode(node,nodes,edges)
        {
            //var edge = new Edge(edges.length,nodes);
            for(let i = 0; i<edges.length; i++)
            {
                console.log("id ndoe predaneho"+node.id);

                //if((edges[i].nodes[0].id==node.id||edges[i].nodes[1].id==node.id))
                if((edges[i].nodes[0]==node||edges[i].nodes[1]==node))
                {
                    for(let j = edges[i].id; j < edges.length-1; j++)
                    {
                        edges[j]=edges[j+1];
                        edges[j].id=(edges[j].id)-1;
                    }
                    edges.pop();
                    console.log(edges);
                    //this.parent.removeChild(this.parent.getChildByName("line_"+edges[i].id));
                }

            }

            drawEdges(edges);
        }

        function bindFunctionalityToBitmap(node,bitmap,edges,nodes) {

            bitmap.on("mousedown", function (evt) {
                //this.parent.addChild(this);
                console.log(""+bitmap.id);
                console.log(""+this.name)
                console.log(edges)
                console.log(nodes);
                this.offset = {x: this.x - evt.stageX, y: this.y - evt.stageY};
                if(addEdgeFlag==true)
                {
                    if(selectedNodesNumber<1)
                    {
                        selectedNodesNumber++;
                        selectedNodes.push(nodes[bitmap.id]);
                    }
                    else
                    {
                        selectedNodes.push(nodes[bitmap.id]);
                        addEdgeBetweenNodes(selectedNodes,edges);
                        selectedNodesNumber=0;
                        selectedNodes = []
                        addEdgeFlag=false;
                    }
                }
                else if(removeNodeFlag==true)
                {
                    console.log(nodes)
                    removeAllEdgesFromNode(nodes[bitmap.id],nodes,edges);
                    //drawEdges(edges);
                    for(let i = bitmap.id; i < nodes.length-1; i++)
                    {
                        console.log("stalo se");
                        nodes[i]=nodes[i+1];
                        nodes[i].id=(nodes[i].id)-1;
                        let selectedBitmap = this.parent.getChildByName("bmp_"+(i+1));
                        selectedBitmap.id=selectedBitmap.id-1;
                        selectedBitmap.name="bmp_"+i;
                        this.parent.addChild(selectedBitmap);

                        let node_text = this.parent.getChildByName("text_"+selectedBitmap.id);
                        node_text.x=selectedBitmap.x-textoffset;
                        node_text.y=selectedBitmap.y-textoffset-3;
                        this.parent.addChild(node_text);
                    }
                    nodes.pop();

                    //cleanupnu smycku vytvorenou mezi smazanym edgem
                    for(let i = 0; i<edges.length; i++)
                    {
                        if((edges[i].nodes[0].id===edges[i].nodes[1].id))
                        {
                            console.log("HALO HALO");
                            for(let j = edges[i].id; j < edges.length-1; j++)
                            {
                                edges[j]=edges[j+1];
                                edges[j].id=(edges[j].id)-1;
                            }
                            edges.pop();
                        }
                    }

                    drawEdges(edges);

                    this.parent.removeChild(this.parent.getChildByName("text_"+nodes.length));
                    let text = document.getElementById("test_"+nodes.length);
                    text.parentNode.removeChild(text);
                    this.parent.removeChild(this);
                }
                else if(removeEdgeFlag==true)
                {
                    if(selectedNodesNumber<1)
                    {
                        selectedNodesNumber++;
                        selectedNodes.push(nodes[bitmap.id]);
                    }
                    else
                    {
                        selectedNodes.push(nodes[bitmap.id]);
                        removeEdgeBetweenNodes(selectedNodes,edges);
                        selectedNodesNumber=0;
                        selectedNodes = []
                        removeEdgeFlag=false;
                    }
                }
                update=true;
                removeNodeFlag=false;
            });

            // the pressmove event is dispatched when the mouse moves after a mousedown on the target until the mouse is released.
            bitmap.on("pressmove", function (evt) {
                node.x=evt.stageX + this.offset.x;
                node.y=evt.stageY + this.offset.y;
                this.x = node.x
                this.y = node.y

                for(var i = 0; i < edges.length; i++)
                {
                    if(node.id===edges[i].nodes[0].id)
                    {
                        g.clear();
                        edges[i].nodes[0]=node
                        drawEdges(edges);
                    }
                    else if(node.id===edges[i].nodes[1].id)
                    {
                        g.clear();
                        edges[i].nodes[1]=node
                        drawEdges(edges);
                    }
                }
                var node_text = this.parent.getChildByName("text_"+this.id);
                node_text.x=node.x-textoffset;//textoffset;
                node_text.y=node.y-textoffset-3;//textoffset;

                this.parent.addChild(node_text);
                // indicate that the stage should be updated on the next tick:
                update = true;
            });

            bitmap.on("rollover", function (evt) {
                //this.scale = this.originalScale * 1.2;
                update = true;
            });

            bitmap.on("rollout", function (evt) {
                //this.scale = this.originalScale;
                update = true;
            });

            bitmap.parent.getChildByName("text_"+bitmap.id).on("dblclick", function (evt)
            {
                let node_text = this;
                node_text.text = "";
            });
        }

        function handleImageLoad(event) {
            var textoffset = 3;
            var bitmap;
            var container = new createjs.Container();
            var text;
            var node_image = "./assets/images/node.png";
            var add_edge_image = "./assets/images/addedge.png";


            stage.addChild(container);

            const nodes = [];
            const edges = [];

            for(var i = 0; i < 5; i++)
            {
                nodes.push(new Node(i,i,(canvas.width * Math.random() | 0),(canvas.height * Math.random() | 0)));
            }

            edges.push(new Edge(0,[nodes[0],nodes[1]]));
            edges.push(new Edge(1,[nodes[1],nodes[2]]));

            // create and populate the screen with random daisies:
            for (var i = 0; i < nodes.length; i++) {

                bitmap = new createjs.Bitmap(node_image);
                addNodeToBitmap(nodes[i],container,bitmap);

                // using "on" binds the listener to the scope of the currentTarget by default
                // in this case that means it executes in the scope of the button.
                bindFunctionalityToBitmap(nodes[i],bitmap,edges, nodes);
            }
            stage.on("stagemousedown", function(evt) {
                if(addNodeFlag==true)
                {
                    var newNode = new Node(nodes.length,nodes.length,(evt.stageX),(evt.stageY))
                    nodes.push(newNode);
                    console.log(newNode);
                    console.log(nodes);
                    var bitmap = new createjs.Bitmap(node_image);
                    addNodeToBitmap(newNode,container,bitmap);
                    bindFunctionalityToBitmap(newNode,bitmap,edges,nodes);
                    addNodeFlag=false;
                    update = true;
                }
                /*else if(addEdge==true)
                {
                    selectedNodesNumber++;
                    selectedNodes.push()

                    var newEdge = new Edge(edges.length,)
                }*/
                stage.update(event)
                for(let i =0; i<edges.length;i++)
                {
                    console.log(""+stage.getChildByName("line_"+edges[i].id));
                }
                console.log("clicked");
                drawEdges(edges);

            });

            drawEdges(edges);

            examples.hideDistractor();
            createjs.Ticker.addEventListener("tick", tick);
        }

        function tick(event) {
            // this set makes it so the stage only re-renders when an event handler indicates a change has happened.
            if (update) {
                update = false; // only update once
                stage.update(event);
            }
        }

        function addNodeBtnClicked() {
            addNodeFlag=!addNodeFlag;
        }
        function addEdgeBtnClicked() {
            addEdgeFlag=!addEdgeFlag;
        }
        function removeNodeBtnClicked() {
            removeNodeFlag=!removeNodeFlag;
        }
        function removeEdgeBtnClicked() {
            removeEdgeFlag=!removeEdgeFlag;
        }

    </script>
